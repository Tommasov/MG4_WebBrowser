[versions]
agp = "8.6.0"
appcompat = "1.7.0"
# Not a dependency of ours, only a floor. See the constraints in app/build.gradle.kts.
kotlin = "1.8.22"

[libraries]
# AppCompat only. The head unit's WebView is a Chromium 69 that will never be updated, so
# nothing here may assume a modern engine; a browser over that engine needs no more than
# a themeable activity, and every extra library is weight on a 2018 device.
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
kotlin-stdlib-jdk7 = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk7", version.ref = "kotlin" }
kotlin-stdlib-jdk8 = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk8", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
